name: 自动编译 Sing-box 规则集

on:
  push:
    paths:
      - 'custom.yaml' # 只有当你修改 custom.yaml 时才会触发在线编译
  workflow_dispatch: # 允许你在网页上点击按钮手动触发

# 修复 1：明确赋予工作流对仓库的写入权限，解决 exit code 128
permissions:
  contents: write

# 修复 2：解决 Node.js 20 弃用警告，提前强制工作流在 Node.js 24 下运行
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 Python 依赖
        run: pip install pyyaml

      - name: 执行转换脚本 (YAML 转 JSON)
        run: python convert.py

      - name: 下载并安装最新版 Sing-box 内核
        run: |
          VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz
          tar -xvf sing-box-${VERSION}-linux-amd64.tar.gz
          mv sing-box-${VERSION}-linux-amd64/sing-box ./sing-box

      - name: 编译为二进制 SRS 格式
        run: |
          ./sing-box rule-set compile custom.json -o custom.srs
          echo "编译完成，生成 custom.srs"

      - name: 将生成的自动提交回仓库
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add custom.json custom.srs
          
          # 优化 Git 检查逻辑，防止无变更时强行 commit 报错
          if git diff --staged --quiet; then
            echo "没有检测到规则文件发生变化，跳过提交。"
          else
            git commit -m "chore: 自动更新编译规则集 [skip ci]"
            git push
          fi
